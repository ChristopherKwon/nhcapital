services:
  pgdb:
    image: pgvector/pgvector:pg16
    container_name: nhcapital-pgdb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itsm_db}
      POSTGRES_USER: ${POSTGRES_USER:-itsm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itsm_password}
    ports:
      - "5432:5432"
    volumes:
      - nhcapital_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itsm_user} -d ${POSTGRES_DB:-itsm_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nhcapital_pgdata:
